server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update   # ⬅️ first deploy safe
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  cors:
    # comma separated list of frontend origins, e.g. https://feedback-app.vercel.app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  seed-demo-data: false
  admin:
    # optional: creates one ADMIN account at startup (password min 8 chars)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
