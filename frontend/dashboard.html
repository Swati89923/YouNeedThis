    </div>

    <div id="developerSection" class="card hidden">

    <ul>
        <li><a href="projects.html">Create / My Projects</a></li>
        <li><a href="project-feedback.html">View Project Feedback</a></li>
    </ul>
   </div>


 <div id="reviewerSection" class="card hidden">
    <h3>Reviewer Panel</h3>
    <ul>
        <li><a href="reviewer-projects.html">Available Projects</a></li>
        <li><a href="my-feedback.html">My Feedback</a></li>

    </ul>
</div>


</div>

</html>
